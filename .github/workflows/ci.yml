name: CatchGrid release checks

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: catchgrid-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate and verify Worker binding types
        run: pnpm cf-typegen && pnpm cf-typegen:check
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format
      - name: Run unit and Worker D1 tests
        run: pnpm test
      - name: Verify catalog deterministically
        run: pnpm catalog:verify
      - name: Build production bundle with release metadata
        run: pnpm build:artifact
      - name: Validate Cloudflare deployment package
        run: pnpm exec wrangler deploy --dry-run --strict
      - name: Audit dependency advisories
        run: pnpm audit --audit-level high

  browser-chromium:
    name: browser-chromium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright engine
        run: pnpm exec playwright install --with-deps chromium
      - name: Run mobile, desktop, and PWA Chromium flows
        run: pnpm exec playwright test --project=mobile-chromium --project=desktop-chromium --project=pwa-chromium
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-chromium
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  browser-webkit:
    name: browser-webkit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out reviewed source
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright engine
        run: pnpm exec playwright install --with-deps webkit
      - name: Run mobile and desktop WebKit flows
        run: pnpm exec playwright test --project=mobile-webkit --project=desktop-webkit
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7
