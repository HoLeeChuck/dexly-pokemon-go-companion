<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>CatchGrid. Track every catch. Build the perfect search.</title>
  <desc>
    A slate card with CatchGrid's interlocking letter mark, ice-blue accent and a collection grid.
  </desc>
  <rect width="1200" height="630" fill="#101115" />
  <rect
    x="28"
    y="28"
    width="1144"
    height="574"
    rx="28"
    fill="#15171d"
    stroke="#303640"
    stroke-width="2"
  />
  <g font-family="Arial, Helvetica, sans-serif">
    <g font-size="42" font-weight="400">
      <text x="70" y="112" fill="#eceef1">C</text>
      <text x="87" y="112" fill="#c4deec">G</text>
    </g>
    <text x="138" y="112" font-size="38" font-weight="700" letter-spacing="-1.5" fill="#eceef1">
      CatchGrid
    </text>
    <text x="72" y="201" font-size="20" letter-spacing="1" fill="#a4afbf">
      YOUR POKÉMON GO COLLECTION COMPANION
    </text>
    <text x="68" y="290" font-size="64" font-weight="700" letter-spacing="-2" fill="#eceef1">
      Track every catch.
    </text>
    <text x="68" y="369" font-size="64" font-weight="700" letter-spacing="-2" fill="#c4deec">
      Build the perfect
    </text>
    <text x="68" y="444" font-size="64" font-weight="700" letter-spacing="-2" fill="#c4deec">
      search.
    </text>
    <text x="72" y="540" font-size="22" fill="#a4afbf">
      Your Dex. Your device. No account needed.
    </text>
    <text x="1118" y="540" text-anchor="end" font-size="20" fill="#c4deec">dex.cjdev.app</text>
  </g>
  <g stroke="#303640" stroke-width="2" fill="#101115">
    <rect x="834" y="190" width="78" height="78" rx="18" />
    <rect x="936" y="190" width="78" height="78" rx="18" fill="#25313d" />
    <rect x="1038" y="190" width="78" height="78" rx="18" />
    <rect x="834" y="292" width="78" height="78" rx="18" fill="#25313d" />
    <rect x="936" y="292" width="78" height="78" rx="18" />
    <rect x="1038" y="292" width="78" height="78" rx="18" fill="#25313d" />
    <rect x="834" y="394" width="78" height="78" rx="18" />
    <rect x="936" y="394" width="78" height="78" rx="18" fill="#25313d" />
    <rect x="1038" y="394" width="78" height="78" rx="18" />
  </g>
  <g fill="none" stroke="#c4deec" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <path d="m958 228 11 11 21-23" />
    <path d="m856 330 11 11 21-23" />
    <path d="m1060 330 11 11 21-23" />
    <path d="m958 432 11 11 21-23" />
