<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Dexly is a visual, unofficial Pokemon GO collection companion."
    />
    <meta name="theme-color" content="#0c2723" />
    <script>
      (() => {
        const saved = localStorage.getItem('dexly:theme');
        const theme =
          saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const accent = localStorage.getItem('dexly:accent-theme') || 'green';
        document.documentElement.dataset.theme = theme;
        document.documentElement.dataset.accent = accent;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Dexly · Pokémon GO Collection Companion</title>
  </head>
  <body>
    <noscript>Dexly needs JavaScript to manage your collection.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
